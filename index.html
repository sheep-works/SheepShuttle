<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://lambuage.com/app/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SheepComb - 移転のお知らせ</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid #334155;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.5rem; margin-bottom: 12px; color: #14b8a6; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #14b8a6;
      color: #0f172a;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s;
    }
    a:hover { background: #2dd4bf; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🐑 SheepComb 移転のお知らせ</h1>
    <p>SheepComb は新しい URL（lambuage.com/app）へ移転しました。<br>自動的に移動しない場合は、下のボタンをクリックしてください。</p>
    <a href="https://lambuage.com/app/">新サイトへ移動する</a>
  </div>
  <script>
    window.location.replace("https://lambuage.com/app/");
  </script>
</body>
</html>
